<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1580" viewBox="0 0 1280 1580" role="img" aria-labelledby="title description">
  <title id="title">Current private model: Front Door, Application Gateway, Internal APIM, private AKS and private Key Vault</title>
  <desc id="description">Implemented private architecture for apim-private-lab in West US 3 and Central US, not evidence of a completed live deployment. Front Door Premium with WAF reaches two private Application Gateway HTTPS listeners through explicitly approved managed Private Link connections. Each gateway forwards HTTPS to its local private APIM VIP with the regional APIM hostname for Host and SNI. One classic Premium APIM service reaches local private AKS backends. A shared managed identity retrieves a public wildcard PFX through a local vault Private Endpoint in each isolated region. Separate DNS resource groups hold independent privatelink.vaultcore.azure.net views; the vault public endpoint stays Disabled. The domain, paid order and exact vault binding live in a separate retained bootstrap group. No peering or public gateway application listeners are introduced.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#166534"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <style>
      text { font-family: "Noto Sans", sans-serif; fill: #183153; }
      .title { font-size: 27px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .detail { font-size: 15px; fill: #475569; }
      .small { font-size: 14px; fill: #475569; }
      .private { fill: none; stroke: #166534; stroke-width: 2.5; marker-end: url(#arrow); }
      .public { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue); }
      .configuration { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 5; }
    </style>
  </defs>
