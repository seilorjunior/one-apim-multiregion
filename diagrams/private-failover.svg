<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title description">
  <title id="title">Private-model workload failover and recovery test design</title>
  <desc id="description">Test design, not observed private failover results. Client requests traverse Front Door WAF, approved Private Link, regional private Application Gateway, local Internal APIM and private AKS. Separate test control uses Azure CLI and AKS Run Command to stop and restore only the selected workload. Verify both private origins, collect baseline responses, scale one region to zero, require five consecutive survivor responses, restore original replicas and require fresh post-restoration metrics before interrupting the other region. Temporary cluster-scoped access is optional and only newly created assignments are removed. A workload simulation is not an Azure region outage and elapsed samples are not an RTO guarantee.</desc>
  <defs>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c56a09"/></marker>
    <style>
      text { font-family: "Noto Sans", sans-serif; fill: #183153; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #475569; }
      .private { fill: none; stroke: #15803d; stroke-width: 2.5; marker-end: url(#green); }
      .public { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#blue); }
      .control { fill: none; stroke: #c56a09; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#orange); }
    </style>
  </defs>
  <rect width="1400" height="1100" fill="#fff"/>
  <text x="700" y="43" text-anchor="middle" class="title">Private ingress: workload failover and recovery</text>
  <text x="700" y="73" text-anchor="middle" class="body">Test design only | no private-run timings asserted | one region disrupted at a time</text>
  <rect x="40" y="111" width="320" height="177" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="65" y="142" class="heading">Separate test control</text>
  <text x="65" y="171" class="body">Test-EndToEnd: PowerShell / Bash</text>
  <text x="65" y="200" class="body">Optional temporary Cluster Admin</text>
  <text x="65" y="229" class="body">Azure CLI -> AKS Run Command</text>
  <text x="65" y="261" class="small">Not part of application request routing</text>
  <rect x="590" y="111" width="400" height="62" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="790" y="149" text-anchor="middle" class="heading">Client GET /whoami + HEAD readiness</text>
  <path d="M790 173 V214" class="public"/>
  <text x="809" y="199" class="small">Public HTTPS</text>
  <rect x="480" y="216" width="650" height="91" rx="12" fill="#eff6ff" stroke="#2563eb"/>
  <text x="805" y="248" text-anchor="middle" class="heading">Front Door Premium + WAF</text>
  <text x="805" y="277" text-anchor="middle" class="body">regional-apis-private | HEAD /lab/health/ready</text>
  <path d="M650 307 V337 H580 V374" class="private"/>
  <path d="M960 307 V337 H1130 V374" class="private"/>
  <rect x="425" y="343" width="310" height="25" fill="#fff"/>
  <rect x="975" y="343" width="310" height="25" fill="#fff"/>
  <text x="580" y="361" text-anchor="middle" class="small">Approved Private Link + HTTPS</text>
  <text x="1130" y="361" text-anchor="middle" class="small">Approved Private Link + HTTPS</text>
  <rect x="370" y="376" width="430" height="375" rx="14" fill="#f0fdf4" stroke="#86b69b"/>
  <rect x="920" y="376" width="430" height="375" rx="14" fill="#f0fdf4" stroke="#86b69b"/>
  <text x="585" y="407" text-anchor="middle" class="heading">West US 3 - Primary</text>
  <text x="1135" y="407" text-anchor="middle" class="heading">Central US - Secondary</text>
  <rect x="395" y="429" width="380" height="61" rx="9" fill="#fff" stroke="#15803d"/>
  <rect x="945" y="429" width="380" height="61" rx="9" fill="#fff" stroke="#15803d"/>
  <text x="585" y="466" text-anchor="middle" class="body">Private Application Gateway HTTPS listener</text>
  <text x="1135" y="466" text-anchor="middle" class="body">Private Application Gateway HTTPS listener</text>
  <path d="M585 490 V530" class="private"/>
  <path d="M1135 490 V530" class="private"/>
  <rect x="395" y="532" width="380" height="68" rx="9" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="945" y="532" width="380" height="68" rx="9" fill="#eef2ff" stroke="#6366f1"/>
  <text x="585" y="559" text-anchor="middle" class="body">Local APIM gateway - Internal VNet</text>
  <text x="1135" y="559" text-anchor="middle" class="body">Local APIM gateway - Internal VNet</text>
  <text x="585" y="583" text-anchor="middle" class="small">FDID + gateway/backend locality validation</text>
  <text x="1135" y="583" text-anchor="middle" class="small">FDID + gateway/backend locality validation</text>
  <text x="860" y="555" text-anchor="middle" class="small">ONE APIM</text>
  <text x="860" y="578" text-anchor="middle" class="small">service</text>
  <path d="M585 600 V640" class="private"/>
  <path d="M1135 600 V640" class="private"/>
  <rect x="395" y="642" width="380" height="82" rx="9" fill="#fff" stroke="#15803d"/>
  <rect x="945" y="642" width="380" height="82" rx="9" fill="#fff" stroke="#15803d"/>
  <text x="585" y="672" text-anchor="middle" class="body">Private AKS -> internal LB -> lab-api</text>
  <text x="1135" y="672" text-anchor="middle" class="body">Private AKS -> internal LB -> lab-api</text>
  <text x="585" y="701" text-anchor="middle" class="small">Original replicas -> 0 -> original replicas</text>
  <text x="1135" y="701" text-anchor="middle" class="small">Survivor stays running; reverse after recovery.</text>
  <path d="M200 288 V683 H393" class="control"/>
  <path d="M190 288 V778 H1375 V683 H1327" class="control"/>
  <rect x="40" y="815" width="1320" height="156" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="65" y="845" class="heading">Acceptance sequence - require fresh evidence before the next interruption</text>
  <text x="65" y="874" class="body">1. Both origins approved and healthy; collect five baseline responses.  2. Scale only the selected workload to zero and verify.</text>
  <text x="65" y="903" class="body">3. Require five consecutive survivor responses.  4. Restore the original replica count and verify rollout.</text>
  <text x="65" y="932" class="body">5. Both origins: two fresh completed one-minute buckets at Minimum 100%.  6. Reverse regions, clean up new RBAC, final smoke.</text>
  <rect x="40" y="992" width="1320" height="78" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="65" y="1023" class="body">Workload failure is not a full Azure regional outage. Sample timings include Run Command overhead and are not an RTO guarantee.</text>
  <text x="65" y="1050" class="small">Controlled cleanup restores replicas and removes only newly created temporary grants. Forced termination can still require manual recovery.</text>
</svg>
